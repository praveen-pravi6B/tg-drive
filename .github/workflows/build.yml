name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_TG_API_ID: ${{ secrets.VITE_TG_API_ID }}
          VITE_TG_API_HASH: ${{ secrets.VITE_TG_API_HASH }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: tg-drive-dist
          path: dist
          retention-days: 14
